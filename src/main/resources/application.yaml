spring:
  application:
    name: navalrivals
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: trueno ca

api:
  security:
    cors:
      origins: ${FRONT_DOMAIN}
    token:
      secret: ${JWT_SECRET:default-dev-secret-naval-rivals}

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true