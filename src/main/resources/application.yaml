spring:
  application:
    name: navalrivals-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 600000        # 10 minutos
      keepalive-time: 120000      # 2 minutos
      connection-timeout: 20000   # Timeout de 20s
      idle-timeout: 300000        # 5 minutos ocioso
      validation-timeout: 5000    # 5s
  flyway:
    enabled: true

api:
  security:
    cors:
      origins: ${FRONT_DOMAIN}
    token:
      secret: ${SECRET_TOKEN_API}

game:
  turn-timeout-seconds: 60
  reconnect-timeout-seconds: 30
  cleanup:
    abandoned-threshold-minutes: 15
    inactive-in-progress-threshold-minutes: 10
    finished-threshold-minutes: 2
    interval-ms: 120000

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    com.navalrivals: INFO

management:
  opentelemetry:
    tracing:
      sampling:
        probability: 1.0
      export:
        otlp:
          endpoint: ${OPENTELEMETRY_TRACING_ENDPOINT}
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY}
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    enable-by-default: false
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      enabled: true
      show-details: always
    info:
      enabled: true
    prometheus:
      enabled: true
    metrics:
      enabled: true