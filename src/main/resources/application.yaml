spring:
  application:
    name: navalrivals
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true

api:
  security:
    cors:
      origins: ${FRONT_DOMAIN}
    token:
      secret: ${SECRET_TOKEN_API}

game:
  turn-timeout-seconds: 60
  reconnect-timeout-seconds: 30
  cleanup:
    abandoned-threshold-minutes: 15
    inactive-in-progress-threshold-minutes: 10
    finished-threshold-minutes: 2
    interval-ms: 120000

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    com.navalrivals: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus